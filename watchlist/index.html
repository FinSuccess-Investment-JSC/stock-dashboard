:root{--navy:#1D2678;--blue:#2938A8;--teal:#59C5C8;--purple:#861C52;--gold:#FFD45D;--bg:#F5F6FB;--card:#fff;--ink:#303540;--muted:#596272;--line:#E5E7F0;--head:#1D2678;--up:#1A7A50;--dn:#B3303F;--upbg:#E3F4EC;--dnbg:#FBE6E9;--hover:#F0F3FF}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,system-ui,sans-serif}
header{background:var(--navy);color:#fff}
header .in,main{max-width:1440px;margin:0 auto;padding:16px}
header .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
header .k{font-size:11px;letter-spacing:3px;color:var(--teal);font-weight:800}
header .sp{flex:1}
header button,header a{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.bar input{flex:1;min-width:200px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--ink);font:inherit}
.bar .meta{color:var(--muted);font-size:12px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:first-child,th:nth-child(2),td:first-child,td:nth-child(2){text-align:left}
th.on{color:var(--head)}th.on::after{content:' ▼';font-size:9px}th.on.asc::after{content:' ▲'}
td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:hover td{background:var(--hover)}
td a{color:var(--head);font-weight:800;text-decoration:none}
td .nm{color:var(--muted);font-size:12px;display:inline-block;max-width:210px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.chg{display:inline-block;min-width:64px;padding:2px 6px;border-radius:6px;font-weight:700}
.pctbar{display:inline-flex;align-items:center;gap:6px}
.pctbar i{display:block;width:56px;height:6px;border-radius:3px;background:var(--line);position:relative}
.pctbar i b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--blue)}
:root[data-theme=dark] .pctbar i b{background:var(--teal)}
.view{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:#E7F5F5;color:#256F72}
.view.n{background:#FFF5D4;color:#795900}.view.x{background:#FBE4E7;color:#B3303F}
.na{color:var(--muted)}
footer{color:var(--muted);font-size:12px;margin:14px 2px}
@media(max-width:700px){td .nm{display:none}}
</style>

const vn=(v,d=2)=>v==null?'<span class="na">—</span>':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:d});
const date=s=>s?s.split('-').reverse().join('/'):'—';
function heat(v){if(v==null)return '<span class="na">—</span>';if(v===0)return '<span class="chg" style="color:var(--muted)">■ 0%</span>';const a=Math.min(Math.abs(v)/6,1),up=v>=0;
  return `<span class="chg" style="background:${up?`rgba(31,160,100,${.1+a*.35})`:`rgba(210,60,80,${.1+a*.35})`};color:var(--${up?'up':'dn'})">${up?'▲':'▼'} ${(v>0?'+':'')+vn(v)}%</span>`;}
function spark(p){if(!p||p.length<2)return '<span class="na">—</span>';const mn=Math.min(...p),mx=Math.max(...p),w=96,h=26;
  const pts=p.map((v,i)=>(i/(p.length-1)*w).toFixed(1)+','+(h-2-(mx===mn?.5:(v-mn)/(mx-mn))*(h-4)).toFixed(1)).join(' ');
  const c=p[p.length-1]>=p[0]?'var(--up)':'var(--dn)';return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;}
const pct=v=>v==null?'<span class="na">—</span>':`<span class="pctbar"><i><b style="left:calc(${v}% - 1.5px)"></b></i>${v}</span>`;
function view(v){if(!v)return '<span class="na">—</span>';const s=String(v).toLowerCase();const c=/tiêu cực|bán/.test(s)?'x':/trung lập|theo dõi/.test(s)?'n':'';return `<span class="view ${c}">${String(v).toUpperCase()}</span>`;}
let sortK='chg1d',asc=false,q='';
function render(){
  const f=ROWS.filter(r=>!q||r.code.toLowerCase().includes(q)||(r.name||'').toLocaleLowerCase('vi').includes(q));
  f.sort((a,b)=>{const x=a[sortK],y=b[sortK];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*(asc?1:-1);});
  document.getElementById('tb').innerHTML=f.map(r=>`<tr><td><a href="../${r.folder?r.folder+'/':''}">${r.code}</a> <span class="nm">${r.name||''}</span></td><td>${view(r.view)}</td>
<td>${vn(r.price,0)}</td><td>${heat(r.chg1d)}</td><td>${heat(r.chg1m)}</td><td>${spark(r.spark)}</td><td>${r.pe==null?vn(null):vn(r.pe)+'x'}</td><td>${pct(r.pePct)}</td><td>${r.pb==null?vn(null):vn(r.pb)+'x'}</td><td>${pct(r.pbPct)}</td><td>${date(r.priceDate)}</td></tr>`).join('');
  document.querySelectorAll('th').forEach(th=>{th.classList.toggle('on',th.dataset.k===sortK);th.classList.toggle('asc',th.dataset.k===sortK&&asc);});
  document.getElementById('meta').textContent=f.length+'/'+ROWS.length+' mã';
}
document.querySelector('thead').addEventListener('click',e=>{const th=e.target.closest('th');if(!th||th.hasAttribute('data-nosort'))return;
  if(sortK===th.dataset.k)asc=!asc;else{sortK=th.dataset.k;asc=sortK==='code'||sortK==='view';}render();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus();}});
document.getElementById('theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('fs_theme_v1',n)}catch(e){}};
render();
</script>
